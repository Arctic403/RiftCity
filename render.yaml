services:
  - type: web
    name: riftcity-backend
    runtime: node
    buildCommand: bash .render/build.sh
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: riftcity-db
          property: connectionString
      - key: NODE_ENV
        value: production

  - type: web
    name: riftcity-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist

databases:
  - name: riftcity-db
    databaseName: riftcity
    user: riftcity
